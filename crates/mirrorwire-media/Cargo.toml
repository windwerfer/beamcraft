[package]
name = "mirrorwire-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# FFmpeg (libx264/VAAPI/VideoToolbox encode, hardware decode, swscale). Off = pure-Rust build:
# FilmCraft encoder + decoder only (decisions D17).
ffmpeg = ["dep:ffmpeg-next"]
portal = ["dep:ashpd", "dep:pipewire"]
static-ffmpeg = ["ffmpeg", "ffmpeg-next/static"]
# Pure-Rust FilmCraft H.264 encoder as an optional presenter backend (`--encoder filmcraft`).
filmcraft = ["dep:filmcraft-h264enc"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
ffmpeg-next = { version = "9", optional = true }
mirrorwire-proto = { path = "../mirrorwire-proto" }
# FilmCraft's pure-Rust H.264 decoder: the software decoder on Linux and Windows (decision log
# 2026-11-15). The craft-video pin lives in mirrorwire-film.
mirrorwire-film = { path = "../mirrorwire-film" }
# Not on crates.io; pinned to a reviewed commit (deny.toml allows only this git source
# and craft-libs, which it depends on).
filmcraft-h264enc = { git = "https://github.com/storytold/filmcraft", rev = "cb9783ba1a2b658ba2adc7cb131226d156bb2356", optional = true }

# tokio: the FrameSource remote-input channel (all platforms), fs for portal tokens (Linux).
tokio = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", optional = true, default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
pipewire = { version = "0.10", optional = true }
