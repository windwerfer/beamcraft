[package]
name = "beamcraft-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "beamcraft"
path = "src/main.rs"

[features]
default = ["gui", "portal"]
gui = ["dep:eframe"]
portal = ["beamcraft-media/portal"]
filmcraft = ["beamcraft-media/filmcraft"]
static-ffmpeg = ["beamcraft-media/static-ffmpeg"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
clap = { version = "4", features = ["derive"] }
beamcraft-proto = { path = "../beamcraft-proto" }
beamcraft-media = { path = "../beamcraft-media" }
beamcraft-net = { path = "../beamcraft-net" }
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "wgpu", "default_fonts", "wayland", "x11", "clipboard"] }
dirs = "7"
libc = "0.2"
